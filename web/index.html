<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>伴读</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/favicon.png">
<meta name="theme-color" content="#F2EEE6">
<!--
  视觉方向：吕敬人「评点本」（design/direction-approved.md）。
  一页书，读者拿藤黄荧光笔划，老师在页边用蓝黑墨水批；书名、页码印在中间的「版心」。
  颜色只来自应用图标的两笔：靛 #233A5E、藤黄 #FFC43D；纸和墨的中性色借藤黄的色相。
  字体全用系统自带，应用保持离线：宋体 Songti SC（原文译文、界面）、楷体 Kaiti SC（Claude 的讲解）、Charter（西文和数字）。
-->
<style>
  :root {
    --paper: oklch(0.975 0.009 88);      /* #F9F7F0 纸 */
    --paper-deep: oklch(0.950 0.012 86); /* #F2EEE6 版心 */
    --paper-hi: oklch(0.990 0.005 90);   /* #FDFCF8 输入底 */
    --rule: oklch(0.860 0.014 82);       /* #D6D0C7 线 */
    --rule-soft: oklch(0.915 0.012 84);  /* #E7E2DA 细线 */
    --ink: oklch(0.24 0.012 70);         /* #231E19 墨，对纸 15.4:1 */
    --ink-2: oklch(0.40 0.012 70);       /* #4C4741 次墨 */
    --ink-3: oklch(0.53 0.012 72);       /* #706B64 注，4.9:1 */
    --dian: oklch(0.348 0.070 259);      /* #233A5E 靛，图标底色 */
    --dian-ink: oklch(0.300 0.060 259);  /* #1B2E4C 蓝黑，Claude 的字 */
    --tenghuang: oklch(0.852 0.157 83.6);/* #FFC43D 藤黄，图标那道划线 */
    --hl-now: oklch(0.852 0.157 83.6 / 0.66);
    --hl-past: oklch(0.852 0.157 83.6 / 0.30);
    --danger: oklch(0.50 0.15 30);

    --latin: "Charter", "Songti SC", "STSong", serif;
    --song: "Charter", "Songti SC", "STSong", serif;
    --kai: "Charter", "Kaiti SC", "STKaiti", serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--ink);
    font: 15px/1.6 var(--song); font-synthesis: none; -webkit-font-smoothing: antialiased;
    line-break: strict; text-autospace: normal; font-variant-numeric: lining-nums; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:disabled { opacity: .45; cursor: default; }
  [hidden] { display: none !important; }
  ::selection { background: var(--hl-now); }

  /* ───────── 三栏：书页 · 版心 · 批注 ───────── */
  /* 批注栏宽度 --pi-col：拖版心时由 app.js 改写 */
  .frame { --pi-col: clamp(340px, 30vw, 440px); display: grid; grid-template-columns: minmax(0, 1fr) 56px var(--pi-col); height: 100%; }
  #left { position: relative; min-width: 0; overflow: hidden; } /* 缩放预览时阅读区整体放大，别盖到版心上 */
  body.resizing, body.resizing * { cursor: col-resize !important; user-select: none !important; }

  /* ───────── 版心：取代顶栏 ───────── */
  .spine { position: relative; display: flex; flex-direction: column; align-items: center; padding: 20px 0 18px;
    background: linear-gradient(90deg, oklch(0.93 0.014 84) 0, transparent 12px, transparent 44px, oklch(0.93 0.014 84) 56px), var(--paper-deep);
    min-height: 0; overflow: hidden; cursor: col-resize; user-select: none; } /* 版心就是书页和批注栏的分界，按住空白处左右拖 */
  .spine::before, .spine::after { content: ""; position: absolute; top: 0; bottom: 0; width: 4px; }
  body.resizing .spine::before, body.resizing .spine::after { border-color: var(--dian); }
  .spine::before { left: 0; border-left: 1px solid var(--rule); border-right: 1px solid var(--rule-soft); }
  .spine::after { right: 0; border-right: 1px solid var(--rule); border-left: 1px solid var(--rule-soft); }
  .slip { writing-mode: vertical-rl; font: 400 13px/1 var(--song); letter-spacing: .3em; padding: 10px 7px 7px;
    border: 1px solid var(--rule); border-radius: 2px; color: var(--ink-2); background: var(--paper-hi);
    transition: border-color .15s, color .15s, background .15s; flex: none; }
  .slip:hover { border-color: var(--dian); color: var(--dian); }
  .slip.on { background: var(--dian); border-color: var(--dian); color: var(--paper); }
  .slip + .slip { margin-top: 12px; }
  .yuwei { width: 20px; height: 10px; fill: var(--dian); flex: none; }
  .yuwei.up { margin-top: 30px; }
  #spine-title { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 12px 0; }
  #spine-title span { writing-mode: vertical-rl; max-height: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; /* 只占一列，放不下用省略号 */
    font: italic 400 13px/1.25 var(--latin); color: var(--ink-2); }
  #spine-title span.cjk { font: 400 16px/1 var(--song); font-style: normal; letter-spacing: .5em; color: var(--ink); }
  #folio { margin-top: 14px; display: flex; flex-direction: column; align-items: center; font-family: var(--latin); flex: none; }
  #folio b { font-size: 20px; font-weight: 400; line-height: 1; color: var(--ink); font-variant-numeric: oldstyle-nums; }
  #folio i { width: 16px; height: 1px; background: var(--ink-3); margin: 6px 0; }
  #folio span { font-size: 13px; line-height: 1; color: var(--ink-3); }
  /* 书页缩放：页码下面一竖排 ＋ 百分比 －；手动定过大小时百分比转靛色，点它回到自动 */
  #zoom { margin-top: 16px; display: flex; flex-direction: column; align-items: center; gap: 6px; flex: none; }
  #zoom-in, #zoom-out { width: 24px; height: 24px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper-hi);
    font: 400 16px/22px var(--latin); color: var(--ink-2); transition: border-color .15s, color .15s; }
  #zoom-in:not(:disabled):hover, #zoom-out:not(:disabled):hover { border-color: var(--dian); color: var(--dian); }
  #zoom-val { font: 400 12px/1 var(--latin); color: var(--ink-3); padding: 2px 0; cursor: default; }
  #zoom.manual #zoom-val { color: var(--dian); cursor: pointer; }
  #zoom.manual #zoom-val:hover { text-decoration: underline; text-underline-offset: 3px; }
  .spine .seal { margin-top: 18px; width: 26px; height: 26px; flex: none; }
  #install { margin-top: 14px; }

  /* ───────── 书页 ───────── */
  #viewer { position: absolute; inset: 0; overflow: auto; padding: 28px 0 40vh; }
  .page { position: relative; margin: 0 auto 52px; background: transparent; }
  /* 双页：左右两页一排，放不下时 reader.js 去掉 spread 回到单页 */
  #viewer.spread { display: grid; grid-template-columns: repeat(2, max-content); justify-content: safe center; align-content: start; gap: 52px 40px; }
  #viewer.spread .page { margin: 0; }
  .page::after { content: "— " attr(data-page) " —"; position: absolute; left: 0; right: 0; bottom: -34px;
    text-align: center; font: 400 12px/1 var(--latin); color: var(--ink-3); letter-spacing: .08em; pointer-events: none; }
  .page > canvas, .crop-inner canvas { mix-blend-mode: multiply; } /* 白纸印进纸色，书页和批注是同一张纸 */
  .page > canvas { position: absolute; inset: 0; display: block; }
  .hl { position: absolute; mix-blend-mode: multiply; pointer-events: none; z-index: 1; background: var(--hl-past);
    border-radius: 2px 3px 3px 2px; clip-path: polygon(0.5% 0, 100% 0, 99.5% 100%, 0 100%); }
  .hl.current { background: var(--hl-now); }
  .hl.noted::after { content: ""; position: absolute; top: 0; right: 0; width: 0; height: 0; /* 眉批：首行右上角折起的一个小三角，靛色，压在划线的黄上 */
    border-top: 9px solid var(--dian); border-left: 9px solid transparent; }
  .pangxian { position: absolute; width: 2px; background: var(--dian); border-radius: 1px; z-index: 1; pointer-events: none; }
  .ocr-badge { position: absolute; top: 10px; right: 10px; z-index: 3; display: flex; align-items: center; gap: 6px;
    padding: 4px 9px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper-hi);
    font: 400 12px/1 var(--song); color: var(--ink-3); }
  .ocr-badge::before, .tr.pending::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--tenghuang);
    animation: pulse 1.4s ease-in-out infinite; }
  .ocr-badge.failed { cursor: pointer; color: var(--danger); }
  .ocr-badge.failed::before { background: var(--danger); animation: none; }
  .ocr-badge.failed:hover { border-color: var(--danger); }
  .ocr-badge.redo { cursor: pointer; opacity: .55; transition: opacity .15s, border-color .15s, color .15s; }
  .ocr-badge.redo::before { display: none; } /* 识别完了，不再脉动 */
  .page:hover .ocr-badge.redo, .ocr-badge.redo:focus-visible { opacity: 1; }
  .ocr-badge.redo:hover { border-color: var(--dian); color: var(--dian); }
  .ocr-badge.redo.busy { cursor: default; opacity: 1; }
  .ocr-badge.redo.busy::before { display: block; }
  body.dragging #left { outline: 1px dashed var(--dian); outline-offset: -14px; }

  /* 中英对照：原图块 + 译文块 */
  .page.bilingual { padding-bottom: 8px; }
  .crop { position: relative; overflow: hidden; margin: 0 auto; }
  .crop-inner { position: absolute; }
  .crop-inner canvas { position: absolute; display: block; }
  .tr { position: relative; margin: 0 auto; padding-top: 2px; padding-bottom: 16px; color: var(--ink);
    font-family: var(--song); line-height: 1.75; text-align: justify; overflow-wrap: anywhere; }
  .tr::before { content: "译"; position: absolute; left: calc(var(--indent, 0px) - 30px); top: 7px;
    font: 400 12px/1 var(--song); color: var(--dian); border: 1px solid currentColor; border-radius: 2px; padding: 2px 2px 1px; }
  .tr.pending { color: var(--ink-3); font-size: 12px !important; display: flex; align-items: center; gap: 8px; }
  .tr.pending::after { order: -1; }
  .tr.pending::before { opacity: .45; }
  .tr.error { color: var(--danger); font-size: 12px !important; }
  .tr-redo { position: absolute; top: 0; right: 0; padding: 3px 7px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper-hi);
    font: 400 12px/1 var(--song); color: var(--ink-3); opacity: 0; transition: opacity .15s, border-color .15s, color .15s; user-select: none; }
  .tr-redo::after { content: "重译"; }
  .tr:hover .tr-redo, .tr-redo:focus-visible { opacity: 1; }
  .tr-redo:hover { border-color: var(--dian); color: var(--dian); }

  /* ───────── 书架 ───────── */
  #library { position: absolute; inset: 0; overflow: auto; padding: 60px 48px 80px 56px; }
  #library .inner { max-width: 900px; margin: 0 auto; }
  .lib-intro { margin: 0; font: 400 15px/24px var(--song); color: var(--ink-2); }
  .search { margin-top: 20px; height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 16px;
    border: 1px solid var(--rule); border-radius: 4px; background: var(--paper-hi); }
  .search:focus-within { border-color: var(--dian); }
  .search svg { width: 17px; height: 17px; flex: none; fill: none; stroke: var(--ink-3); stroke-width: 1.5; }
  #search { flex: 1; border: 0; outline: 0; background: transparent; font: 400 15px/1 var(--song); color: var(--ink); }
  #search::placeholder { color: var(--ink-3); }
  #library .sec { margin: 0; font: 600 17px/24px var(--song); letter-spacing: .06em; color: var(--ink); }
  .sec-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 56px; }
  #library .sec-row .sec small { margin-left: 10px; font: 400 13px/1 var(--song); letter-spacing: 0; color: var(--dian); }
  .btns { display: flex; gap: 10px; }
  .btn { font: 400 14px/1 var(--song); padding: 10px 14px; border-radius: 3px; border: 1px solid var(--rule);
    color: var(--ink); background: var(--paper-hi); transition: border-color .15s, color .15s, background .15s; }
  .btn:hover { border-color: var(--dian); color: var(--dian); }
  .btn.solid { background: var(--dian); border-color: var(--dian); color: var(--paper); }
  .btn.solid:hover { background: var(--dian-ink); color: var(--paper); }
  .muted { color: var(--ink-3); font: 400 14px/1.7 var(--song); }

  /* 最近在读：书口厚度＝页数，书口里一道藤黄＝读到的位置 */
  #recent { margin-top: 24px; display: grid; grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); gap: 30px 32px; }
  .book { position: relative; display: block; color: inherit; text-decoration: none; cursor: pointer; min-width: 0; }
  .book .obj { position: relative; display: flex; height: 160px; transition: transform .2s ease; }
  .book .obj::after { content: ""; position: absolute; left: -18px; right: -18px; bottom: 0; height: 1px; background: var(--ink-3);
    box-shadow: 0 1px 0 var(--paper-hi), 0 7px 10px -5px rgb(60 45 30 / .35); } /* 隔板，相邻几本连成一条 */
  .book img { display: block; height: 160px; width: auto; max-width: calc(100% - var(--e, 4px)); flex: none; object-fit: cover; object-position: top;
    box-shadow: 0 0 0 1px rgb(40 30 20 / .10), 2px 3px 8px -3px rgb(40 30 20 / .35); background: var(--paper-hi); }
  /* 题签封面：第一页是白纸的报告、文献不拿白纸当封面，照线装书的样子做一张——靛蓝布面（图标底色）、左侧一道藤黄书脊线（图标那道划线）、
     纸色题签写书名；中文书名竖排题签（放不下折成第二列）、西文横排 */
  .gen { position: relative; display: block; width: var(--cw, 113px); height: var(--ch, 160px); flex: none; overflow: hidden; background: var(--dian);
    background-image: repeating-linear-gradient(135deg, rgb(255 255 255 / .045) 0 1px, transparent 1px 3px);
    box-shadow: 0 0 0 1px rgb(40 30 20 / .10), 2px 3px 8px -3px rgb(40 30 20 / .35); }
  .gen::before { content: ""; position: absolute; left: 7px; top: 0; bottom: 0; width: 1.5px; background: var(--tenghuang); opacity: .9; }
  .gen .tag { position: absolute; background: var(--paper-hi); border: 1px solid var(--rule); color: var(--ink); overflow: hidden;
    font: 400 12px/1.35 var(--song); box-shadow: 1px 1px 0 rgb(0 0 0 / .18); }
  .gen .tag.v { left: 15px; top: 9px; max-height: calc(100% - 42px); max-width: 58px; padding: 10px 2px; writing-mode: vertical-rl; letter-spacing: .14em; line-height: 1.7; }
  .gen .tag.h { left: 17px; right: 11px; top: 26px; padding: 8px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; line-height: 1.4; letter-spacing: .02em; }
  .gen .n { position: absolute; right: 9px; bottom: 8px; font: 400 10px/1 var(--latin); color: oklch(0.88 0.03 85 / .75); letter-spacing: .06em; }
  .book .edge { position: relative; width: var(--e, 4px); height: 154px; margin-top: 3px; flex: none;
    background: repeating-linear-gradient(90deg, oklch(0.965 0.008 86) 0 1px, oklch(0.885 0.012 82) 1px 2px); border-right: 1px solid var(--rule); }
  .book .edge i { position: absolute; top: -3px; bottom: -3px; left: var(--p, 0%); width: 1.5px; background: var(--tenghuang); }
  .book:hover .obj { transform: translateY(-4px); }
  .book .t { margin-top: 14px; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden;
    font: 400 13.5px/1.45 var(--song); color: var(--ink); }
  .book:hover .t { color: var(--dian); }
  .book .bar { position: relative; height: 4px; margin-top: 10px; }
  .book .bar::before { content: ""; position: absolute; left: 0; right: 0; top: 1.5px; height: 1px; background: var(--rule); }
  .book .bar i { position: absolute; left: 0; top: 0; height: 4px; width: var(--p, 0%); border-radius: 2px; background: var(--tenghuang); }
  .book .n { margin-top: 8px; font: 400 13px/1 var(--latin); color: var(--ink-2); }
  .book .n small { font: 400 12px/1 var(--song); color: var(--ink-3); margin-left: 2px; }
  .book .rm { position: absolute; top: -8px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--rule);
    background: var(--paper-hi); color: var(--ink-3); font: 400 13px/20px var(--latin); opacity: 0; transition: opacity .15s; z-index: 2; }
  .book:hover .rm { opacity: 1; }
  .book .rm:hover { color: var(--danger); border-color: var(--danger); }

  /* 书桌：最近打开的那本摊在书架上面——大封面、读到哪、最近划的一句（没划过线就是正读的那段）、「接着读」 */
  #desk { position: relative; margin-top: 40px; display: flex; gap: 36px; padding: 30px 34px 28px 30px; background: var(--paper-hi);
    border: 1px solid var(--rule); border-radius: 3px; box-shadow: 0 16px 30px -24px rgb(60 45 30 / .55); }
  #desk .book { flex: none; }
  #desk .book .obj { height: 212px; }
  #desk .book .obj::after { display: none; }
  #desk .book img, #desk .book .gen { height: 212px; --ch: 212px; --cw: 150px; max-width: none; }
  #desk .book .gen .tag { font-size: 13px; }
  #desk .book .gen .tag.v { max-width: 70px; left: 18px; top: 12px; padding: 12px 3px; }
  #desk .book .gen .tag.h { top: 34px; left: 20px; right: 14px; padding: 10px; }
  #desk .book .edge { height: 206px; }
  #desk .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  #desk .k { margin: 2px 0 0; font: 400 12px/1 var(--song); letter-spacing: .22em; color: var(--dian); display: flex; align-items: center; gap: 9px; }
  #desk .k::before { content: ""; width: 18px; height: 1px; background: var(--dian); }
  #desk h2 { margin: 12px 0 0; font: 600 21px/1.4 var(--song); letter-spacing: .01em; color: var(--ink);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #desk h2 a { color: inherit; text-decoration: none; }
  #desk h2 a:hover { color: var(--dian); }
  #desk .m { margin: 8px 0 0; font: 400 13.5px/1 var(--latin); color: var(--ink-2); }
  #desk .bar { position: relative; height: 5px; margin-top: 14px; max-width: 440px; }
  #desk .bar::before { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 1px; background: var(--rule); }
  #desk .bar i { position: absolute; left: 0; top: 0; height: 5px; width: var(--p, 0%); border-radius: 2px; background: var(--tenghuang); }
  #desk .ql { margin: 20px 0 0; font: 400 12px/1 var(--song); color: var(--ink-3); letter-spacing: .04em; }
  #desk .q { margin: 7px 0 0; max-width: 560px; font: 400 15px/1.75 var(--song); color: var(--ink);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  #desk .q.page { color: var(--ink-2); border-left: 2px solid var(--dian); padding-left: 12px; }
  #desk .q mark { background: var(--hl-past); color: inherit; padding: 2px 0; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  #desk .acts { margin-top: auto; padding-top: 20px; display: flex; align-items: center; gap: 18px; }
  #desk .st { font: 400 13px/1 var(--song); color: var(--ink-3); }
  #desk .desk-ext { margin-top: 14px; font: 400 13px/1.5 var(--song); color: var(--ink-3); }
  #desk .desk-ext:empty { display: none; }
  #desk .rm { position: absolute; top: 10px; right: 10px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--rule);
    background: var(--paper-hi); color: var(--ink-3); font: 400 13px/20px var(--latin); opacity: 0; transition: opacity .15s; }
  #desk:hover .rm { opacity: 1; }
  #desk .rm:hover { color: var(--danger); border-color: var(--danger); }

  /* 搜索结果、书库文件夹：目录式点线 */
  .toc { list-style: none; margin: 14px 0 0; padding: 0; border-top: 1px solid var(--rule); }
  .toc li { display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 8px 4px; border-bottom: 1px solid var(--rule-soft); transition: background .15s; }
  .toc li:hover { background: var(--paper-deep); }
  .toc .name { font: 400 16px/1.4 var(--song); color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc a.name { text-decoration: none; cursor: pointer; }
  .toc a.name:hover { color: var(--dian); }
  .toc .leader { flex: 1; min-width: 24px; height: 2px; margin-top: 8px; opacity: .55;
    background-image: radial-gradient(circle, var(--ink-3) 0.8px, transparent 1px); background-size: 6px 2px; background-repeat: repeat-x; }
  .toc .count { font: 400 15px/1 var(--latin); color: var(--ink-2); white-space: nowrap; }
  .toc .count small, .toc .path { font: 400 13px/1.4 var(--song); color: var(--ink-3); margin-left: 3px; }
  .toc .path { max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .toc .acts { display: flex; gap: 2px; margin-left: 6px; }
  .toc .acts button { font: 400 13px/1 var(--song); color: var(--ink-3); padding: 7px 8px; border-radius: 3px; }
  .toc .acts button:hover { color: var(--dian); background: var(--paper-hi); }
  #results:not(:empty) { margin-bottom: 8px; }
  #scan-status { font: 400 13px/1 var(--song); color: var(--dian); }
  .drop { margin-top: 32px; height: 60px; display: flex; align-items: center; justify-content: center; gap: 10px;
    border: 1px dashed var(--rule); border-radius: 4px; font: 400 14px/1 var(--song); color: var(--ink-3); }

  /* ───────── 批注栏（问 Claude） ───────── */
  #chat { display: flex; flex-direction: column; min-height: 0; padding: 0 28px 0 24px; background: var(--paper); }
  .pi-head { flex: none; padding: 22px 0 16px; border-bottom: 1px solid var(--rule-soft); }
  .pi-head .row { display: flex; justify-content: space-between; align-items: center; }
  .pi-head h2 { margin: 0; font: 600 16px/24px var(--song); letter-spacing: .04em; color: var(--ink); }
  #pi-book { margin: 6px 0 0; font: italic 400 13px/1.45 var(--latin); color: var(--ink-3); }

  .ghost { font: 400 13px/1 var(--song); color: var(--ink-2); border: 1px solid var(--rule); border-radius: 3px; padding: 7px 10px;
    background: var(--paper-hi); transition: border-color .15s, color .15s; }
  .ghost:hover { border-color: var(--dian); color: var(--dian); }

  /* Claude 看到：读者划的那句，整句写全 */
  #sees { flex: none; padding-top: 16px; }
  #sees-label { display: flex; align-items: center; gap: 8px; font: 400 12.5px/18px var(--song); color: var(--ink-3); letter-spacing: .02em; }
  #sees-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--dian); }
  #sees-quote { margin: 6px 0 0; font: 400 15px/1.6 var(--latin); color: var(--ink);
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; }
  #sees-quote mark { color: inherit; background: var(--hl-now); padding: .08em .12em; -webkit-box-decoration-break: clone; box-decoration-break: clone; border-radius: 2px; }
  #sees-quote:empty { display: none; }

  #messages { flex: 1; min-height: 0; overflow: auto; padding: 20px 0 8px;
    -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 24px); mask-image: linear-gradient(180deg, transparent 0, #000 24px); } /* 往上滚出去的字渐隐，不是一刀切 */
  .msg { position: relative; padding-left: 28px; margin-bottom: 20px; overflow-wrap: anywhere; }
  .msg.user::before, .msg.assistant::before { position: absolute; left: 0; top: 5px; font: 400 12px/1 var(--song);
    padding: 2px 2px 1px; border-radius: 2px; border: 1px solid currentColor; }
  .msg.user { font: 400 15.5px/1.7 var(--song); color: var(--ink); white-space: pre-wrap; }
  .msg.user::before { content: "问"; color: var(--ink-3); }
  .msg.assistant { font: 400 16px/1.75 var(--kai); color: var(--dian-ink); } /* 栏窄、夹着长英文词，两端对齐会把整行中文撑开 */
  .msg.assistant::before { content: "答"; color: var(--paper); background: var(--dian); border-color: var(--dian); top: 6px; }
  .msg.assistant > :first-child { margin-top: 0; }
  .msg.assistant p, .msg.assistant ul, .msg.assistant ol { margin: 6px 0; }
  .msg.assistant strong { font-weight: 700; }
  .msg.assistant h1, .msg.assistant h2, .msg.assistant h3, .msg.assistant h4 { position: relative; margin: 16px 0 6px;
    font: 600 15px/24px var(--song); color: var(--dian); letter-spacing: .03em; }
  .msg.assistant h1::before, .msg.assistant h2::before, .msg.assistant h3::before { content: ""; position: absolute; left: -27px; top: 8px;
    width: 12px; height: 7px; background: var(--dian); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 42%, 0 100%); } /* 小鱼尾 */
  .msg.assistant ol { list-style: none; counter-reset: n; padding-left: 0; }
  .msg.assistant ol > li { counter-increment: n; position: relative; padding-left: 20px; }
  .msg.assistant ol > li + li, .msg.assistant ul > li + li { margin-top: 6px; }
  .msg.assistant ol > li::before { content: counter(n) "."; position: absolute; left: 0; top: 0; font: 400 15px/28px var(--latin); color: var(--dian); }
  .msg.assistant ul { padding-left: 18px; }
  .msg.assistant ul > li::marker { color: var(--dian); }
  .msg.assistant blockquote { margin: 8px 0; padding: 2px 0 2px 12px; border-left: 2px solid var(--rule); color: var(--ink-2); }
  .msg.assistant code { font: 13px/1 ui-monospace, Menlo, monospace; background: var(--paper-deep); padding: 1px 4px; border-radius: 3px; }
  .msg.assistant table { border-collapse: collapse; margin: 10px 0; font: 400 13.5px/1.5 var(--song); color: var(--ink); }
  .msg.assistant th, .msg.assistant td { border-bottom: 1px solid var(--rule-soft); padding: 5px 10px 5px 0; text-align: left; vertical-align: top; }
  .msg.assistant th { font-weight: 600; color: var(--dian); border-bottom-color: var(--rule); }
  .msg.assistant hr { border: 0; border-top: 1px solid var(--rule-soft); margin: 14px 0; }
  /* 划线、问题、回答一组：组头是这几问对着的那句划线（点它跳回书页），左边一道藤黄竖线把这几轮问答串起来 */
  .qa { position: relative; margin-bottom: 28px; }
  .qa::before { content: ""; position: absolute; left: 8px; top: 14px; bottom: 4px; width: 2px; border-radius: 1px; background: var(--hl-past); }
  .qa > .msg:last-child { margin-bottom: 0; }
  .qa .msg.user::before { background: var(--paper); } /* 竖线从「问」字标底下穿过，不划过字 */
  .quote { position: relative; display: block; width: 100%; margin-bottom: 14px; padding-left: 28px; text-align: left;
    font: 400 14.5px/1.65 var(--latin); color: var(--ink); }
  .quote::before { content: "划"; position: absolute; left: 0; top: 4px; padding: 2px 2px 1px; border: 1px solid var(--tenghuang); border-radius: 2px;
    background: var(--tenghuang); font: 400 12px/1 var(--song); color: var(--ink); }
  .quote-text { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; overflow: hidden; }
  .quote mark { color: inherit; background: var(--hl-past); padding: .06em .1em; border-radius: 2px;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .quote img { display: block; max-width: 100%; max-height: 120px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper-hi); }
  .quote-at { display: block; margin-top: 4px; font: 400 12px/1.4 var(--song); color: var(--ink-3); transition: color .15s; }
  .quote:hover mark { background: var(--hl-now); }
  .quote:hover .quote-at { color: var(--dian); }
  .msg.hint { padding-top: 10px; font: 400 17px/28px var(--kai); color: var(--dian-ink); }
  .msg.hint::after { content: ""; display: block; height: 420px; margin-top: 10px;
    background: repeating-linear-gradient(180deg, transparent 0 27px, var(--rule-soft) 27px 28px);
    -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent); mask-image: linear-gradient(180deg, #000 30%, transparent); } /* 一张等老师落笔的笺 */
  .status { font: 400 14px/1.6 var(--kai); color: var(--ink-3); animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .4; } }
  .error { font: 400 14px/1.6 var(--song); color: var(--danger); }

  .composer { flex: none; padding: 12px 0 20px; border-top: 1px solid var(--rule-soft); }
  #chips { display: flex; gap: 8px; flex-wrap: wrap; }
  #chips button { font: 400 13px/1 var(--song); color: var(--ink-2); padding: 8px 10px; border: 1px solid var(--rule); border-radius: 3px;
    background: var(--paper-hi); transition: border-color .15s, color .15s; }
  #chips button:hover { border-color: var(--dian); color: var(--dian); }
  #ask { position: relative; margin-top: 10px; }
  #q { display: block; width: 100%; height: 84px; resize: none; padding: 12px 14px 12px; border: 1px solid var(--rule); border-radius: 4px;
    background: var(--paper-hi); font: 400 14.5px/1.6 var(--song); color: var(--ink); }
  #q::placeholder { color: var(--ink-3); }
  #q:hover { border-color: var(--ink-3); }
  #q:focus { outline: 0; border-color: var(--dian); }
  #send { position: absolute; right: 10px; bottom: 10px; font: 500 14px/1 var(--song); letter-spacing: .12em; color: var(--paper);
    background: var(--dian); padding: 9px 14px 9px 16px; border-radius: 3px; }
  #send:hover { background: var(--dian-ink); }

  /* ───────── 批注栏视图外壳（问答 · 导读 · 导图） ───────── */
  .pi-head h2:has(+ .tabs:not([hidden])) { display: none; } /* 有多个视图时标题让位给标签 */
  .chat-tools { display: flex; gap: 6px; }
  .chat-tools .ghost { padding: 2px 6px; font-size: 13px; line-height: 20px; } /* 三个按钮（历史、新对话、反问）排紧一点，给标签留地方 */
  #chat-history.on { border-color: var(--dian); color: var(--dian); }
  /* 历史对话：列表和只读查看 */
  .hist-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 4px 0 14px;
    font: 400 13px/1.5 var(--song); color: var(--ink-3); }
  .hist-head b { font-weight: 600; color: var(--ink); }
  .hist-head button { font: 400 13px/1 var(--song); color: var(--dian); white-space: nowrap; }
  .hist-tools { display: flex; gap: 14px; }
  .hist-sub { display: block; margin-top: 2px; font-size: 12px; }
  .hist-item { display: block; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--rule-soft); }
  .hist-item:hover .hist-title { color: var(--dian); }
  .hist-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--rule-soft); }
  .hist-row .hist-item { flex: 1; min-width: 0; width: auto; border-bottom: 0; }
  .hist-resume { flex: none; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 3px; background: var(--paper-hi); font: 400 13px/1 var(--song); color: var(--dian); transition: border-color .15s, background .15s; }
  .hist-resume:hover { border-color: var(--dian); }
  /* 每一问悬停时右上角出「删除」（鼠标在问或答上都出）；字用伪元素写，不进问题的 textContent */
  .msg.user .turn-del { position: absolute; top: 0; right: 0; padding: 3px 8px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper-hi);
    font: 400 12px/1 var(--song); letter-spacing: 0; color: var(--ink-3); opacity: 0; transition: opacity .15s, border-color .15s, color .15s; white-space: normal; }
  .msg.user .turn-del::after { content: "删除"; }
  .msg.user:hover .turn-del, .msg.user:has(+ .msg.assistant:hover) .turn-del, .msg.user .turn-del:focus-visible { opacity: 1; }
  .msg.user .turn-del:hover { color: var(--danger); border-color: var(--danger); }
  .hist-title { display: block; font: 400 15px/1.5 var(--song); color: var(--ink); }
  .hist-meta { display: block; margin-top: 2px; font: 400 12px/1.4 var(--song); color: var(--ink-3); }
  .hist-empty { font: 400 14px/1.7 var(--song); color: var(--ink-3); }
  .msg.note { padding-left: 0; font: 400 13px/1.7 var(--song); color: var(--ink-3); border-top: 1px dashed var(--rule); padding-top: 10px; }
  .pi-head .row { flex-wrap: nowrap; align-items: flex-start; gap: 8px; }
  .tabs { display: flex; flex: 1 1 0; min-width: 0; flex-wrap: wrap; gap: 2px 10px; align-items: flex-end; } /* 标签多到放不下就换行，不挤掉右边的「历史」「新对话」 */
  .chat-tools { flex: none; }
  .tab { position: relative; padding: 2px 0 6px; font: 400 15px/24px var(--song); letter-spacing: .02em; color: var(--ink-3); transition: color .15s; }
  .tab:hover { color: var(--ink); }
  .tab.on { color: var(--ink); font-weight: 600; }
  .tab.on::after { content: ""; position: absolute; left: -2px; right: -2px; bottom: 0; height: 3px; border-radius: 2px; background: var(--tenghuang); } /* 藤黄划线标出当前视图 */
  .view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  /* 容器视图：批注、学习。.secs 是滚动容器，每个模块往里加一节（panel.js 的 registerSection） */
  .secs { flex: 1; min-height: 0; overflow: auto; padding: 4px 0 28px; }
  .secs:empty::after { content: "这里还没有内容。"; display: block; padding: 20px 0; font: 400 14px/1.7 var(--song); color: var(--ink-3); }
  .secs > .sec { margin: 0; padding: 18px 0 16px; border-bottom: 1px solid var(--rule-soft); font: 400 14px/1.7 var(--song); letter-spacing: 0; color: var(--ink); }
  .secs > .sec:last-child { border-bottom: 0; }
  .sec-h { margin: 0 0 10px; font: 600 15px/24px var(--song); letter-spacing: .04em; color: var(--dian); }
  #sees-quote .sees-img { display: block; max-width: 100%; max-height: 140px; border: 1px solid var(--rule); border-radius: 2px; background: var(--paper-hi); }
  /* 附图：输入框上方的缩略图 */
  .attach { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .att { position: relative; display: block; }
  .att img { display: block; height: 56px; max-width: 120px; object-fit: cover; border: 1px solid var(--rule); border-radius: 3px; }
  .att button { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; border: 1px solid var(--rule);
    background: var(--paper-hi); color: var(--ink-3); font: 400 12px/18px var(--latin); }
  .msg-att { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .msg-att img { height: 72px; max-width: 160px; object-fit: cover; border: 1px solid var(--rule); border-radius: 3px; }
  /* 跳回原文：引句所在几行闪一下；找不到引句时整页闪 */
  .textLayer span.flash { background: var(--hl-now); border-radius: 2px; animation: flash 1.8s ease-out; }

  /* 跳到原文之后，书页底部回到原处的按钮 */
  #back-chip { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 5; padding: 7px 14px; border: 1px solid var(--rule); border-radius: 999px;
    background: var(--paper); color: var(--dian); font: 400 13px/1 var(--song); letter-spacing: .04em; box-shadow: 0 2px 10px oklch(0.3 0.03 83.6 / .12); }
  #back-chip:hover { border-color: var(--dian); }
  /* 标签旁的小点：生成中脉动藤黄，生成完人不在那个标签时静止的靛点 */
  .tab .dot { position: absolute; top: 4px; right: -9px; width: 6px; height: 6px; border-radius: 50%; }
  .tab .dot.busy { background: var(--tenghuang); animation: pulse 1.2s ease-in-out infinite; }
  .tab .dot.done { background: var(--dian); }
  .page.flash-page { outline: 2px solid var(--tenghuang); outline-offset: 6px; transition: outline-color 1.6s; }

  #toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%) translateY(16px); opacity: 0; z-index: 20;
    background: var(--dian); color: var(--paper); padding: 9px 16px; border-radius: 3px; font: 400 14px/1.4 var(--song);
    transition: all .2s; max-width: calc(100% - 32px); pointer-events: none; }
  #toast.show { opacity: .96; transform: translateX(-50%); }
  #toast.show.has-action { pointer-events: auto; }
  #toast button { margin-left: 14px; color: var(--tenghuang); font: inherit; text-decoration: underline; text-underline-offset: 3px; }
  /* 要密码的 PDF：打开时弹出的输入框 */
  #pw-dialog { width: 320px; padding: 20px 22px 18px; border: 1px solid var(--rule); border-radius: 4px; background: var(--paper); color: var(--ink);
    box-shadow: 0 8px 28px oklch(0.3 0.03 83.6 / .22); }
  #pw-dialog::backdrop { background: oklch(0.24 0.012 70 / .32); }
  #pw-dialog .pw-note { margin: 0 0 12px; font: 400 14.5px/1.6 var(--song); color: var(--ink-2); }
  #pw-dialog .pw-note.wrong { color: var(--danger); }
  #pw-dialog input { display: block; width: 100%; box-sizing: border-box; padding: 9px 10px; border: 1px solid var(--rule); border-radius: 3px;
    background: var(--paper-hi); font: 400 15px/1.4 var(--song); color: var(--ink); outline: 0; }
  #pw-dialog input:focus { border-color: var(--dian); }
  #pw-dialog .pw-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
  /* 书页上的小工具栏：选完字浮在选区上方（「划线」），点旧划线时出在点击处（「问这句」「删除这条划线」） */
  #hl-menu { position: fixed; z-index: 15; display: flex; background: var(--paper); border: 1px solid var(--rule); border-radius: 7px;
    box-shadow: 0 3px 14px oklch(0.3 0.03 83.6 / .16); padding: 3px; }
  #hl-menu button { padding: 7px 13px; font: 400 13px/1 var(--song); color: var(--ink); border-radius: 4px; white-space: nowrap; }
  #hl-menu button + button { border-left: 1px solid var(--rule); border-radius: 0 4px 4px 0; }
  #hl-menu button:hover { background: var(--hl-past); }

  /* 以下为 pdf.js 4.10 官方 textLayer 样式（web/pdf_viewer.css 摘录），负责可选中的透明文字层 */
  .textLayer { position: absolute; text-align: initial; inset: 0; overflow: clip; opacity: 1; line-height: 1;
    text-size-adjust: none; forced-color-adjust: none; transform-origin: 0 0; caret-color: CanvasText; z-index: 2; }

  .textLayer > :not(.markedContent), .textLayer .markedContent span:not(.markedContent) { z-index: 1; }
  .textLayer span.markedContent { top: 0; height: 0; }
  .textLayer ::selection { background: var(--hl-now); }
  .textLayer br::selection { background: transparent; }
  .textLayer .endOfContent { display: block; position: absolute; inset: 100% 0 0; z-index: 0; cursor: default; user-select: none; }
  .textLayer.selecting .endOfContent { top: 0; }
</style>
</head>
<body>
  <div class="frame">
    <section id="left">
      <div id="viewer" hidden></div>
      <button id="back-chip" type="button" hidden></button>
      <div id="library">
        <div class="inner">
          <p class="lib-intro">打开一本书，选中一段就是划线，在右边直接问 Claude。</p>
          <label class="search">
            <svg viewBox="0 0 18 18" aria-hidden="true"><circle cx="7.6" cy="7.6" r="5.6"/><path d="M11.8 11.8L16 16"/></svg>
            <input id="search" type="search" placeholder="搜书名或文献名，多个关键词用空格隔开" autocomplete="off">
          </label>
          <ul id="results" class="toc" hidden></ul>
          <section id="desk" hidden></section>
          <div class="sec-row" id="recent-head"><h3 class="sec">最近在读</h3></div>
          <div id="recent"></div>
          <div class="sec-row">
            <h3 class="sec">书库文件夹<small id="scan-status"></small></h3>
            <div class="btns">

              <button id="add-root" class="btn solid">添加书库文件夹</button>

          </div>
          <ul id="roots" class="toc"></ul>
          <div class="drop">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2v8M4.6 6.8L8 10.2l3.4-3.4M2.5 11v2.5h11V11"/></svg>
            也可以把 PDF 直接拖进这个窗口。
          </div>
        </div>
      </div>
    </section>

    <nav class="spine" aria-label="版心" title="按住版心空白处左右拖，调整书页和批注栏的宽度">
      <button id="home" class="slip on" title="回到书架">书架</button>
      <button id="bi-toggle" class="slip" role="switch" title="在每段英文下面插入中文译文">中英对照</button>
      <button id="region-btn" class="slip" type="button" hidden title="在书页上拖出一个框，把图、表格或公式发给 Claude。也可以按住 ⌥ 直接拖">框选</button>
      <svg class="yuwei up" viewBox="0 0 20 10" aria-hidden="true"><path d="M0 0H20V10L10 4.4L0 10Z"/></svg>
      <div id="spine-title"><span class="cjk">伴读</span></div>
      <svg class="yuwei" viewBox="0 0 20 10" aria-hidden="true"><path d="M0 10H20V0L10 5.6L0 0Z"/></svg>
      <div id="folio" hidden><b id="folio-n"></b><i></i><span id="folio-total"></span></div>
      <div id="zoom" hidden>
        <button id="zoom-in" type="button" title="放大书页（也可以在书页上双指张开，或按住 ⌘ 滚动）" aria-label="放大书页">+</button>
        <button id="zoom-val" type="button"></button>
        <button id="zoom-out" type="button" title="缩小书页（也可以在书页上双指捏合）" aria-label="缩小书页">−</button>
      </div>
      <button id="install" class="slip" hidden>安装到桌面</button>
      <img class="seal" src="/icons/icon-192.png" alt="伴读" draggable="false">
    </nav>
